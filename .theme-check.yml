extends: theme-check:recommended

# locales/vi.schema.json is an intentionally partial schema locale (HVDQ
# Sprint 3/4 decision): it holds only the new HVDQ-specific schema keys,
# not a full translation of Horizon's built-in schema strings.
# locales/en.default.schema.json remains the complete, fully-covered
# default schema locale that the Shopify Theme Editor falls back to.
MatchingTranslations:
  ignore:
    - locales/vi.schema.json
